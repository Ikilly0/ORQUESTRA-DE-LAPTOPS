<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Orden / Desorden: cartas del director</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  body { font-family: Helvetica, Arial, sans-serif; margin: 0; }
  .card { width: 100%; height: 180mm; page-break-after: always; display: flex; flex-direction: column;
          align-items: center; justify-content: center; border: 3px solid #222; border-radius: 12px; box-sizing: border-box; }
  .n { font-size: 28px; color: #888; } .name { font-size: 150px; font-weight: bold; margin: 10px 0; }
  .t { font-size: 30px; max-width: 80%; text-align: center; } .foot { margin-top: 30px; font-size: 18px; color: #666; }
</style></head><body>
<script>
const CARDS = [
  ["1","TUTTI","Todos tocan."],
  ["2","SOLO","Solo la estación indicada (el director la señala). El resto calla."],
  ["3","DÚO","Las dos estaciones indicadas: pregunta y respuesta de un compás."],
  ["4","XP","Intercambio: los que tocan paran y los que callaban entran."],
  ["5","ECO","Imita el ritmo de la estación indicada, con tus propias notas."],
  ["6","CAPAS","Entrada de a uno, cada 2 compases, de grave a agudo."],
  ["7","CORTE","Silencio total en el 1 del próximo compás."],
  ["8","ORDEN","Volver a leer: pasamos a la sección siguiente en el próximo 1."],
];
for (const [n, name, t] of CARDS)
  document.write(`<div class="card"><div class="n">${n}</div><div class="name">${name}</div><div class="t">${t}</div><div class="foot">Orden / Desorden · la carta vale desde el 1 del compás siguiente</div></div>`);
</script>
</body></html>
