<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui,sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#555"/></marker></defs>
  <style>rect{fill:#f3f6fb;stroke:#4a76c9;rx:6}.e{fill:#fdeee8;stroke:#c95a3a}line,path.l{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}text{fill:#222}.s{font-size:11px;fill:#666}</style>
  <text x="10" y="18" class="s">EXCITACIÓN (un pulso por golpe)</text>
  <rect class="e" x="10" y="115" width="120" height="50"/><text x="70" y="137" text-anchor="middle">Ruido blanco</text><text x="70" y="153" text-anchor="middle" class="s">× ventana exp. d</text>
  <rect class="e" x="160" y="115" width="120" height="50"/><text x="220" y="137" text-anchor="middle">Pasabajos</text><text x="220" y="153" text-anchor="middle" class="s">BiquadFilter, corte fc</text>
  <rect class="e" x="310" y="115" width="90" height="50"/><text x="355" y="137" text-anchor="middle">Ganancia</text><text x="355" y="153" text-anchor="middle" class="s">vel / √(d·sr)</text>
  <line x1="130" y1="140" x2="158" y2="140"/><line x1="280" y1="140" x2="308" y2="140"/>
  <text x="145" y="200" class="s">dureza → d = 6 ms … 0,15 ms ; fc = 1 kHz … 18 kHz</text>
  <text x="470" y="18" class="s">BANCO DE RESONADORES (persistente)</text>
  <rect x="470" y="30" width="170" height="44"/><text x="555" y="50" text-anchor="middle">Pasabanda f₁, Q₁</text><text x="555" y="66" text-anchor="middle" class="s">BiquadFilter</text>
  <rect x="670" y="30" width="80" height="44"/><text x="710" y="57" text-anchor="middle">× g₁</text>
  <rect x="470" y="90" width="170" height="44"/><text x="555" y="110" text-anchor="middle">Pasabanda f₂, Q₂</text><text x="555" y="126" text-anchor="middle" class="s">BiquadFilter</text>
  <rect x="670" y="90" width="80" height="44"/><text x="710" y="117" text-anchor="middle">× g₂</text>
  <text x="555" y="165" text-anchor="middle" font-size="20">⋮</text>
  <rect x="470" y="180" width="170" height="44"/><text x="555" y="200" text-anchor="middle">Pasabanda f₈, Q₈</text><text x="555" y="216" text-anchor="middle" class="s">BiquadFilter</text>
  <rect x="670" y="180" width="80" height="44"/><text x="710" y="207" text-anchor="middle">× g₈</text>
  <line x1="640" y1="52" x2="668" y2="52"/><line x1="640" y1="112" x2="668" y2="112"/><line x1="640" y1="202" x2="668" y2="202"/>
  <path class="l" d="M400,140 C440,140 440,52 468,52"/><path class="l" d="M400,140 C440,140 440,112 468,112"/><path class="l" d="M400,140 C440,140 440,202 468,202"/>
  <rect class="e" x="560" y="245" width="190" height="40"/><text x="655" y="270" text-anchor="middle">× golpe directo (clic)</text>
  <path class="l" d="M400,145 C420,265 500,265 558,265"/>
  <circle cx="805" cy="140" r="20" fill="#fff" stroke="#555"/><text x="805" y="146" text-anchor="middle" font-size="18">Σ</text>
  <path class="l" d="M750,52 C780,52 785,120 788,126"/><path class="l" d="M750,112 C775,112 780,132 786,135"/><path class="l" d="M750,202 C780,202 785,160 788,154"/><path class="l" d="M750,265 C790,265 800,175 803,162"/>
  <line x1="825" y1="140" x2="890" y2="140"/><text x="858" y="132" text-anchor="middle">salida</text>
  <text x="590" y="162" class="s">Qᵢ = π·fᵢ·T60ᵢ / ln 1000</text>
  <text x="10" y="290" class="s">gᵢ = nivelᵢ / (2·αᵢ), αᵢ = sen(2πfᵢ/sr)/(2Qᵢ): compensa que un filtro más angosto deja pasar menos energía del pulso.</text>
</svg>
